parameters:
  - name: variableName
    displayName: 'Variable Name'
    type: string
    default: 'IsPwshInstalled'
steps:
  - task: Bash@3
    inputs:
        targetType: 'inline'
        script: |
          # Check if PowerShell is installed
          if command -v pwsh &> /dev/null; then
              echo "##vso[task.setvariable variable=${{ parameters.variableName }}]true"
              echo "PowerShell is installed."
          else
              echo "##vso[task.setvariable variable=${{ parameters.variableName }}]false"
              echo "PowerShell is not installed."
          fi
        failOnStderr: false
    displayName: 'Set variable IsPwshInstalled'
    enabled: false
  - bash: |
     echo "##vso[task.setvariable variable=myJobVar]this is the same job"
  - bash: |
     echo "##vso[task.setvariable variable=myOutputJobVar;isOutput=true]this is the same job too"
    name: setOutput
  - bash: |
     echo $(myJobVar)
  - bash: |
     echo $(setOutput.myOutputJobVar)
