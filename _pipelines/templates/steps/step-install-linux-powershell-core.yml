steps:
  - template: /_pipelines/templates/steps/step-check-linux-powershell-core-is-installed.yml
    parameters:
      variableName: 'IsPwshCoreInstalled'
    displayName: 'Check if PowerShell Core is installed'
  - bash: |
      if [ '$(IsPwshCoreInstalled)' == 'true' ]; then
          echo "PowerShell is installed"
      else
          echo "PowerShell is not installed"
      fi
    displayName: 'Install PowerShell Core'
