# File: _pipelines/templates/steps/step-install-linux-virtualbox.yml
# --------------------------------------
parameters:
  - name: Uninstall
    type: boolean
    default: false
steps:
  - ${{ if ne(parameters.Uninstall, true) }}:
    - bash: |
        sudo apt update
        sudo apt install virtualbox -y
        virtualbox --help
      name: "InstallVirtualBox"
      displayName: "Install VirtualBox"
  - ${{ if eq(parameters.Uninstall, true) }}:
    - bash: |
        echo "Uninstalling VirtualBox"
      name: "UninstallVirtualBox"
      displayName: "Uninstall VirtualBox"
